Instead of a programmer writing explicit logic, the network is shown many examples and adjusts millions of internal numbers (weights) until it produces the right outputs. The "deep" part refers to depth: each layer builds a more abstract representation on top of the last, so early layers might detect edges in an image while deep layers recognize whole objects.

This is the technology behind image recognition, speech assistants, translation, and large language models like the one powering this lesson generator.`,viz:{type:"concept-graph",params:{concepts:[{name:"Data",detail:"Raw examples: images, text, audio"},{name:"Neural network",detail:"Layers of learnable weights"},{name:"Training",detail:"Adjust weights to reduce error"},{name:"Learned patterns",detail:"Representations, not hand-written rules"}]}}},{id:"why-neural-networks",title:"Why neural networks?",content:`Traditional programs require explicit rules for every case, which breaks down for tasks like recognizing faces or understanding speech \u{2014} the rules are too complex or unknown to write by hand.

Neural networks solve this by learning the rules themselves from examples. They're universal function approximators: given enough layers and data, they can approximate extremely complex relationships between inputs and outputs.

They also scale well \u{2014} more data and more compute generally make them better, which is why deep learning has overtaken older machine learning methods on tasks like vision and language.`,viz:{type:"concept-graph",params:{concepts:[{name:"Hand-written rules",detail:"Breaks down on complex tasks"},{name:"Learn from examples",detail:"Network infers the rule itself"},{name:"Universal approximation",detail:"Can model near-arbitrary functions"},{name:"Scales with data",detail:"More data & compute → better results"}]}}},{id:"bio-to-artificial",title:"Biological neuron → artificial neuron",content:`A biological neuron receives electrical signals through dendrites, combines them in the cell body (soma), and \u{2014} if the combined signal is strong enough \u{2014} fires an output pulse down its axon to the next neuron.

An artificial neuron mimics this loosely: it takes several numeric inputs, multiplies each by a weight (like dendrite strength), sums them together with a bias, and passes the result through an activation function that decides the "firing" output.

The metaphor is imperfect but useful \u{2014} it's why we call them "neurons," "networks," and why activation functions are described as neurons "firing."`,viz:{type:"neuron-diagram"}},{id:"perceptron",title:"Perceptron",content:`The perceptron, invented in 1958, is the simplest possible neural network: one artificial neuron that makes a binary decision.

It computes a weighted sum of its inputs plus a bias, then applies a step function \u{2014} output 1 if the sum crosses a threshold, otherwise 0. This lets it learn simple linear decision boundaries, like separating two classes of points with a straight line.

A single perceptron can't solve non-linearly-separable problems (famously, XOR) \u{2014} which is precisely why we stack many of them into multi-layer networks.`,viz:{type:"neural-network",params:{layers:[3,1]}}},{id:"weights-bias",title:"Weights and bias",content:`Weights are the learnable numbers that scale each input's influence on a neuron's output \u{2014} a large weight means that input matters a lot; a weight near zero means it's mostly ignored.

The bias is an extra learnable number added after the weighted sum. It shifts the decision boundary independently of the inputs, letting the neuron fire even when all inputs are zero, or requiring a stronger signal before it fires.

Training a network essentially means searching for the combination of weights and biases that minimizes prediction error across all training examples.`,viz:{type:"neural-network",params:{layers:[3,1]}}},{id:"activation-functions",title:"Activation functions",content:`Activation functions introduce non-linearity into a network. Without them, stacking any number of layers would mathematically collapse into a single linear transformation \u{2014} no more powerful than a single perceptron.

Sigmoid squashes values to (0, 1), useful for probabilities but prone to vanishing gradients at extremes. Tanh is similar but centered at zero, ranging (-1, 1). ReLU (max(0, x)) is the modern default for hidden layers \u{2014} simple, fast, and avoids vanishing gradients for positive inputs. Softmax turns a vector of raw scores into a probability distribution across classes, used in classification output layers.

Use the buttons below the plot to compare their shapes.`,viz:{type:"activation-curve",params:{initial:"sigmoid"}}},{id:"forward-propagation",title:"Forward propagation",content:`Forward propagation is simply running an input through the network to get a prediction: each layer computes its weighted sums, applies its activation function, and passes the result to the next layer.

Data flows in one direction \u{2014} input layer \u{2192} hidden layers \u{2192} output layer \u{2014} with no loops. Every neuron's output at each layer becomes an input to the next layer.

This is the "inference" pass \u{2014} the same computation happens whether you're training the network or using an already-trained model to make a prediction.`,viz:{type:"neural-network",params:{layers:[4,5,5,2]}}},{id:"loss-functions-p1",title:"Loss functions",content:`A loss function converts "how wrong was this prediction" into a single number the network can try to minimize. Lower loss means better predictions.

Mean Squared Error (MSE) is common for regression \u{2014} it penalizes large errors heavily by squaring them. Cross-entropy loss is standard for classification \u{2014} it compares predicted class probabilities against the true label, punishing confident wrong answers severely.

Choosing the right loss function matters: it defines exactly what "good performance" means to the optimizer.`,viz:{type:"loss-surface",params:{mode:"gradient-descent"}}},{id:"gradient-descent",title:"Gradient descent",content:`Gradient descent is the core optimization algorithm behind almost all deep learning training. The "gradient" of the loss function tells you the direction of steepest increase \u{2014} so moving in the opposite direction decreases loss.

At each step, the algorithm computes the gradient of the loss with respect to every weight, then nudges each weight slightly against that gradient. Repeat thousands of times and the weights gradually settle into a configuration with low loss.

The visualization below shows this literally: a ball (the current weights) rolling downhill on a loss surface toward the minimum.`,viz:{type:"loss-surface",params:{mode:"gradient-descent"}}},{id:"backpropagation",title:"Backpropagation",content:`Backpropagation is the algorithm that efficiently computes gradients for every weight in a deep network, using the chain rule from calculus.

After a forward pass produces a prediction and a loss, backpropagation works backward through the network layer by layer, calculating how much each weight contributed to the final error. Each layer's gradient depends on the gradients of the layers after it \u{2014} hence "back" propagation.

This is what makes training deep networks computationally feasible: without it, computing gradients for millions of weights individually would be intractable.`,viz:{type:"backprop"},starred:!0},{id:"learning-rate",title:"Learning rate",content:`The learning rate controls how big a step gradient descent takes at each update. It's one of the most important hyperparameters in deep learning.

Too high, and updates overshoot the minimum, causing loss to oscillate or diverge entirely. Too low, and training crawls \u{2014} it may take an impractically long time to converge, or get stuck in a shallow local minimum.

Try dragging the learning rate slider in the gradient descent visualization above to see overshooting and slow convergence firsthand.`,viz:{type:"loss-surface",params:{mode:"learning-rate"}}},{id:"epochs-batches-iterations",title:"Epochs, batches, iterations",content:`An epoch is one full pass through the entire training dataset. A batch is a small subset of that data processed together in one forward/backward pass \u{2014} batching makes training memory-efficient and lets you leverage parallel hardware (GPUs).

An iteration is one weight update, i.e., one batch processed. If you have 1,000 examples and a batch size of 100, one epoch takes 10 iterations.

Training for more epochs generally improves fit, up to a point \u{2014} too many can lead to overfitting (covered in Phase 2).`,viz:{type:"training-dynamics",params:{mode:"epochs-batches"}}}]},{id:"phase2",title:"Phase 2 — Building Neural Networks",subtitle:"We'll actually implement them.",topics:[{id:"nn-from-scratch",title:"Neural network from scratch with NumPy",content:`Before using high-level frameworks, it's worth building a tiny neural network using just NumPy \u{2014} manually implementing forward propagation, a loss function, and backpropagation.

This exercise demystifies what frameworks like PyTorch do automatically: you'll write matrix multiplications for weighted sums, apply activation functions element-wise, compute gradients by hand via the chain rule, and update weights with gradient descent.

Doing this once builds real intuition that makes every later framework \u{2014} PyTorch, TensorFlow \u{2014} much easier to understand rather than feeling like a black box.`,viz:{type:"pipeline-flow",params:{stages:["Input data","Forward pass (NumPy)","Compute loss","Backward pass (manual gradients)","Update weights"]}}},{id:"binary-classification",title:"Binary classification",content:`Binary classification predicts one of two classes \u{2014} spam or not spam, cat or dog, fraud or legitimate. The output layer typically has a single neuron with a sigmoid activation, producing a probability between 0 and 1.

A threshold (usually 0.5) converts that probability into a hard decision. The model is trained with binary cross-entropy loss, which strongly penalizes confident wrong predictions.

Evaluation typically goes beyond raw accuracy to metrics like precision, recall, and F1-score, especially when classes are imbalanced.`,viz:{type:"neural-network",params:{layers:[4,5,1]}}},{id:"multiclass-classification",title:"Multiclass classification",content:`Multiclass classification predicts one of three or more mutually exclusive classes \u{2014} digit recognition (0-9), or classifying news articles into topics.

The output layer has one neuron per class, and a softmax activation converts raw scores into a probability distribution that sums to 1 across all classes. The model is trained with categorical cross-entropy loss.

At inference time, the predicted class is simply the one with the highest output probability.`,viz:{type:"neural-network",params:{layers:[4,6,4]}}},{id:"mini-batch-gradient-descent",title:"Mini-batch gradient descent",content:`Pure gradient descent computes the loss gradient over the entire dataset before each update \u{2014} accurate but slow and memory-heavy for large datasets. Stochastic gradient descent (SGD) goes to the opposite extreme, updating after every single example \u{2014} fast but noisy.

Mini-batch gradient descent is the practical middle ground used almost everywhere: compute gradients over a small batch (commonly 32-256 examples), update weights, then move to the next batch. This balances computational efficiency, memory use, and gradient stability.

Batch size is itself a tunable hyperparameter that affects both training speed and final model quality.`,viz:{type:"training-dynamics",params:{mode:"epochs-batches"}}},{id:"validation-test-sets",title:"Validation/test sets",content:`Data is typically split into three sets: training (used to update weights), validation (used to tune hyperparameters and monitor overfitting during development), and test (used exactly once, at the very end, to report final performance).

The validation set acts as a proxy for "unseen data" during development, letting you compare model configurations fairly. The test set must stay untouched until the end \u{2014} using it repeatedly to guide decisions leaks information and gives an overly optimistic performance estimate.

A common split is 70/15/15 or 80/10/10, though this varies with dataset size.`,viz:{type:"concept-graph",params:{concepts:[{name:"Training set",detail:"Used to update model weights"},{name:"Validation set",detail:"Tune hyperparameters, monitor overfitting"},{name:"Test set",detail:"Final, untouched performance check"}]}}},{id:"overfitting",title:"Overfitting",content:`Overfitting happens when a model learns the training data too specifically \u{2014} including its noise and quirks \u{2014} rather than the general pattern. It shows up as low training loss but much higher validation loss.

This typically occurs when a model is too complex (too many parameters) relative to the amount of training data, or when training runs for too many epochs without regularization.

The chart below shows the classic signature: training and validation loss track together at first, then diverge as the model starts memorizing rather than generalizing.`,viz:{type:"training-dynamics",params:{mode:"overfitting"}}},{id:"regularization",title:"Regularization",content:`Regularization is any technique that discourages a model from overfitting by constraining its complexity. L1 and L2 regularization add a penalty to the loss based on the size of the weights, encouraging smaller, simpler weight values.

Other regularization strategies include dropout (randomly disabling neurons), data augmentation (artificially expanding the training set), and early stopping (halting training when validation loss stops improving).

The goal is always the same: better generalization to unseen data, even if it means slightly worse fit to the training set itself.`,viz:{type:"training-dynamics",params:{mode:"overfitting"}}},{id:"dropout",title:"Dropout",content:`Dropout is a regularization technique that randomly "turns off" a fraction of neurons (commonly 20-50%) during each training step, forcing the network to not rely too heavily on any single neuron or co-adapted group of neurons.

Because a different random subset is dropped each step, the network is effectively trained as an ensemble of many overlapping sub-networks, which tends to generalize better. Dropout is turned off entirely at inference/test time \u{2014} all neurons are active, typically with outputs rescaled to compensate.

Watch the network below: gray nodes are randomly dropped each cycle.`,viz:{type:"training-dynamics",params:{mode:"dropout"}}},{id:"batch-normalization",title:"Batch normalization",content:`Batch normalization normalizes the activations within each layer \u{2014} for each mini-batch, it rescales values to have roughly zero mean and unit variance, then applies a small learnable scale and shift.

This stabilizes and speeds up training significantly: without it, activation distributions can shift wildly as weights update (called "internal covariate shift"), forcing later layers to constantly re-adapt. With batch norm, layers see more consistent input distributions.

It also has a mild regularizing effect and often allows higher learning rates to be used safely.`,viz:{type:"training-dynamics",params:{mode:"batchnorm"}}},{id:"weight-initialization",title:"Weight initialization",content:`How weights are initialized before training starts has a surprisingly large effect on whether a deep network trains successfully at all. Initializing all weights to zero, for instance, makes every neuron in a layer compute identical gradients \u{2014} they never differentiate.

Poor initialization can also cause vanishing gradients (signals shrink toward zero as they pass through many layers) or exploding gradients (signals grow uncontrollably). Modern schemes like Xavier/Glorot and He initialization scale the initial random weights based on the number of inputs/outputs of each layer, keeping activations in a healthy range from the start.

The chart compares a healthy initialization spread (green) against a poor one prone to vanishing/exploding values (red).`,viz:{type:"training-dynamics",params:{mode:"weight-init"}}}]},{id:"phase3",title:"Phase 3 — PyTorch",subtitle:"Then we'll move to PyTorch.",topics:[{id:"pytorch-workflow",title:"The PyTorch workflow",content:`PyTorch is the most widely used deep learning framework in research and increasingly in production. It follows a consistent pipeline for almost every project: wrap your data in Tensors, organize it with a Dataset and DataLoader, define a Model, pick a Loss function and Optimizer, then run a Training loop followed by Evaluation.

Unlike high-level APIs that hide this behind a single ".fit()" call, PyTorch expects you to write the training loop yourself \u{2014} which is more code, but gives full visibility and control over exactly what happens at each step.

The pipeline diagram below shows how data flows through this whole process.`,viz:{type:"pipeline-flow",params:{stages:["Tensor","Dataset","DataLoader","Model","Loss","Optimizer","Training loop","Evaluation"]}},starred:!0},{id:"tensor",title:"Tensor",content:`A Tensor is PyTorch's core data structure \u{2014} an n-dimensional array, similar to a NumPy array, but with two crucial extras: it can run on a GPU for massive speedups, and it can automatically track gradients for backpropagation via autograd.

Scalars are 0-D tensors, vectors are 1-D, matrices are 2-D, and batches of images are typically 4-D (batch, channels, height, width). Nearly everything in PyTorch \u{2014} inputs, weights, outputs, gradients \u{2014} is a tensor.

Setting '.requires_grad = True' on a tensor tells PyTorch to record operations on it so gradients can be computed automatically later.`,viz:{type:"pipeline-flow",params:{stages:["Tensor","Dataset","DataLoader","Model","Loss","Optimizer","Training loop","Evaluation"],highlight:0}}},{id:"dataset",title:"Dataset",content:`A PyTorch Dataset is a class that defines how to access individual examples \u{2014} implementing '__len__' (how many examples exist) and '__getitem__' (how to fetch and preprocess one example given an index).

This abstraction separates "how data is stored and transformed" from "how it's batched and fed to the model," which is handled separately by the DataLoader. PyTorch provides ready-made Dataset classes for common formats (images in folders, CSV files) and you can easily write custom ones for your own data.

Getting preprocessing right here \u{2014} resizing images, tokenizing text, normalizing values \u{2014} has a big effect on training quality.`,viz:{type:"pipeline-flow",params:{stages:["Tensor","Dataset","DataLoader","Model","Loss","Optimizer","Training loop","Evaluation"],highlight:1}}},{id:"dataloader",title:"DataLoader",content:`The DataLoader wraps a Dataset and handles batching, shuffling, and parallel data loading automatically. Instead of manually slicing your data into batches, you just iterate over the DataLoader and it yields ready-to-use batches of tensors.

Shuffling the training data each epoch (shuffle=True) helps prevent the model from learning spurious patterns based on data order. The 'num_workers' parameter lets multiple CPU processes prepare batches in parallel while the GPU trains \u{2014} critical for not letting data loading become a bottleneck.

Together, Dataset + DataLoader form PyTorch's standard data pipeline.`,viz:{type:"pipeline-flow",params:{stages:["Tensor","Dataset","DataLoader","Model","Loss","Optimizer","Training loop","Evaluation"],highlight:2}}},{id:"model",title:"Model",content:`A PyTorch model is a Python class that subclasses 'nn.Module'. You define its layers in '__init__' and describe how data flows through them in a 'forward' method.

Because it's just Python, models can contain arbitrary logic \u{2014} conditionals, loops, dynamic architectures \u{2014} not just a fixed sequence of layers. PyTorch automatically tracks all learnable parameters (weights and biases) declared within the module, so you can pass 'model.parameters()' straight to an optimizer.

This flexible, code-first design is a big part of why PyTorch is popular for research.`,viz:{type:"pipeline-flow",params:{stages:["Tensor","Dataset","DataLoader","Model","Loss","Optimizer","Training loop","Evaluation"],highlight:3}}},{id:"loss-pytorch",title:"Loss",content:`PyTorch provides built-in loss functions as simple callable objects \u{2014} 'nn.MSELoss()' for regression, 'nn.CrossEntropyLoss()' for multiclass classification, 'nn.BCELoss()' for binary classification, among others.

You call the loss function with the model's predictions and the true targets to get a single scalar tensor representing how wrong the model currently is. Because it's a tensor with gradient tracking, calling '.backward()' on it triggers backpropagation through the entire computation graph automatically.

Choosing a loss that matches your task and output format (e.g. matching CrossEntropyLoss's expectation of raw logits, not softmax outputs) is a common early source of bugs.`,viz:{type:"pipeline-flow",params:{stages:["Tensor","Dataset","DataLoader","Model","Loss","Optimizer","Training loop","Evaluation"],highlight:4}}},{id:"optimizer",title:"Optimizer",content:`The optimizer implements the update rule that adjusts model weights using the gradients computed by '.backward()'. PyTorch's 'torch.optim' module provides implementations like 'SGD' and 'Adam' ready to use.

A typical training step calls 'optimizer.zero_grad()' (clear old gradients), 'loss.backward()' (compute new gradients), then 'optimizer.step()' (apply the update). Forgetting 'zero_grad()' is one of the most common PyTorch bugs \u{2014} gradients accumulate by default instead of resetting.

Adam is the most common default choice; SGD with momentum is still preferred in some vision tasks for its generalization properties.`,viz:{type:"pipeline-flow",params:{stages:["Tensor","Dataset","DataLoader","Model","Loss","Optimizer","Training loop","Evaluation"],highlight:5}}},{id:"training-loop",title:"Training loop",content:`The training loop is where everything comes together: for each epoch, iterate over batches from the DataLoader; for each batch, run a forward pass, compute the loss, zero old gradients, backpropagate, and step the optimizer.

Writing this loop explicitly (rather than a hidden '.fit()') is PyTorch's signature style. It means you can easily add custom logic \u{2014} logging, learning-rate schedules, gradient clipping, mixed precision \u{2014} right inside the loop without fighting a framework abstraction.

It looks intimidating at first but is the same handful of lines repeated for every project.`,viz:{type:"pipeline-flow",params:{stages:["Tensor","Dataset","DataLoader","Model","Loss","Optimizer","Training loop","Evaluation"],highlight:6}}},{id:"evaluation",title:"Evaluation",content:`Evaluation measures how well the trained model performs, typically on the held-out validation or test set. Before evaluating, you call 'model.eval()' to switch off training-only behaviors like dropout and batch norm's batch statistics, and wrap the loop in 'torch.no_grad()' to skip gradient tracking for speed and memory savings.

You then run forward passes over the evaluation data and compute metrics relevant to the task \u{2014} accuracy, precision/recall, or loss itself \u{2014} without ever updating the weights.

Comparing training vs. evaluation performance is exactly how you detect overfitting in practice, as covered in Phase 2.`,viz:{type:"pipeline-flow",params:{stages:["Tensor","Dataset","DataLoader","Model","Loss","Optimizer","Training loop","Evaluation"],highlight:7}}}]},{id:"phase4",title:"Phase 4 — Computer Vision (CNNs)",subtitle:"Then: Convolutional Neural Networks.",topics:[{id:"convolution",title:"Convolution",content:`Convolution is the core operation behind CNNs: a small filter (kernel) slides across the input image, computing a weighted sum at each position to produce a single output value. This detects local patterns \u{2014} edges, corners, textures \u{2014} regardless of where they appear in the image.

Because the same filter is reused across every position, convolution has far fewer parameters than a fully-connected layer processing the whole image at once, and it naturally captures spatial structure that flat layers ignore.

The animation below shows a kernel sliding across a grid, producing a smaller output feature map on the right.`,viz:{type:"convolution",params:{mode:"convolution"}},starred:!0},{id:"filters-kernels",title:"Filters / kernels",content:`A filter (or kernel) is the small matrix of learnable weights that convolution slides across the input \u{2014} commonly 3x3 or 5x5. Each filter learns to detect a specific pattern: one might respond strongly to vertical edges, another to a particular color blob or texture.

A convolutional layer typically has many filters (e.g., 64), each producing its own feature map, stacked together as the layer's output. Early layers tend to learn generic, low-level filters (edges, colors); deeper layers learn increasingly complex, task-specific patterns built from combinations of earlier features.

Unlike traditional computer vision where filters were hand-designed, CNNs learn optimal filters automatically from data.`,viz:{type:"convolution",params:{mode:"convolution"}}},{id:"padding",title:"Padding",content:`Padding adds extra pixels (usually zeros) around the border of an input before convolution. Without it, every convolution shrinks the spatial dimensions, and pixels at the edges get used in far fewer computations than pixels near the center.

"Same" padding adds just enough border so the output has the same width/height as the input, preserving spatial dimensions layer to layer. "Valid" padding uses no padding at all, letting the output shrink naturally, which is sometimes desirable for controlling network size.

Padding choice affects both output size and how well border information is preserved through the network.`,viz:{type:"convolution",params:{mode:"padding-stride"}}},{id:"stride",title:"Stride",content:`Stride is how many pixels the filter moves at each step as it slides across the input. A stride of 1 moves one pixel at a time, producing a densely-computed, larger output. A stride of 2 skips every other position, roughly halving the output's width and height.

Larger strides reduce computation and output size \u{2014} a cheap alternative or complement to pooling for downsampling. However, a stride that's too large can skip over important details between sampled positions.

The animation shows the kernel jumping by more than one cell per step when a larger stride is used.`,viz:{type:"convolution",params:{mode:"padding-stride"}}},{id:"pooling",title:"Pooling",content:`Pooling downsamples feature maps, reducing their spatial size while retaining the most important information. Max pooling (the most common variant) slides a small window (e.g., 2x2) across the input and keeps only the maximum value in each window; average pooling keeps the mean instead.

This reduces computation for subsequent layers, provides a degree of translation invariance (small shifts in the input don't change the pooled output much), and helps control overfitting by reducing parameter count downstream.

Notice how the output grid below is smaller than the input \u{2014} that's the downsampling effect in action.`,viz:{type:"convolution",params:{mode:"pooling"}}},{id:"feature-maps",title:"Feature maps",content:`A feature map is the output produced by applying one filter across an entire input \u{2014} a 2D grid showing where and how strongly that filter's pattern was detected across the image.

Each convolutional layer produces a stack of feature maps, one per filter. Early-layer feature maps tend to highlight simple structures like edges or color contrasts; deeper-layer feature maps respond to increasingly abstract, composite patterns (parts of objects, then whole objects).

Visualizing feature maps is a common technique for understanding what a trained CNN has actually learned to detect.`,viz:{type:"convolution",params:{mode:"convolution"}}},{id:"cnn-architecture",title:"CNN architecture",content:`A typical CNN architecture stacks several convolution + activation + pooling blocks to progressively extract higher-level features while reducing spatial size, then flattens the final feature maps into a vector fed through one or more fully-connected layers to produce the final prediction.

Early blocks learn low-level features (edges, textures) over larger spatial maps; later blocks learn high-level, abstract features (object parts, whole objects) over smaller spatial maps but with more channels/filters. Well-known architectures like ResNet and VGG follow this same basic pattern with different depths and connection patterns.

The pipeline below traces this classic flow from raw image to final prediction.`,viz:{type:"pipeline-flow",params:{stages:["Image","CNN","Feature extraction","Classifier","Prediction"]}},starred:!0},{id:"image-classification",title:"Image classification",content:`Image classification assigns an image to one of several predefined categories \u{2014} this is the task CNNs were originally popularized for, especially after the 2012 breakthrough of AlexNet on the ImageNet benchmark.

The pipeline is: an image passes through convolutional layers that extract increasingly abstract features, then a classifier (typically fully-connected layers with softmax) converts those features into class probabilities.

Modern image classifiers achieve superhuman accuracy on many benchmark datasets, though they can still be fooled by adversarial examples and struggle with genuinely out-of-distribution images.`,viz:{type:"pipeline-flow",params:{stages:["Image","CNN","Feature extraction","Classifier","Prediction"]}}},{id:"data-augmentation",title:"Data augmentation",content:`Data augmentation artificially expands a training dataset by applying random, label-preserving transformations to existing examples \u{2014} rotating, flipping, cropping, or color-jittering images, for instance.

This exposes the model to more variation than the original dataset contains, improving generalization and reducing overfitting, especially valuable when labeled data is scarce or expensive to collect. A photo of a cat rotated 15 degrees is still obviously a cat, so the label stays valid while the pixels change.

Augmentation is typically applied only to the training set, on-the-fly during each epoch, never to validation or test data.`,viz:{type:"concept-graph",params:{concepts:[{name:"Rotation",detail:"Random small angle rotations"},{name:"Flip",detail:"Horizontal/vertical mirroring"},{name:"Crop",detail:"Random crops of the image"},{name:"Color jitter",detail:"Brightness/contrast/hue shifts"}]}}},{id:"transfer-learning",title:"Transfer learning",content:`Transfer learning reuses a model already trained on a large dataset (like ImageNet) as the starting point for a new, often smaller, task \u{2014} instead of training a CNN from scratch, which requires huge amounts of data and compute.

Typically, you keep the pretrained convolutional layers (which have already learned generally useful visual features) and replace/retrain only the final classifier layers for your specific task, optionally fine-tuning some earlier layers too with a small learning rate.

This dramatically reduces the data and training time needed and is now the default starting point for most practical computer vision projects.`,viz:{type:"pipeline-flow",params:{stages:["Pretrained CNN","Frozen features","New classifier head","Fine-tune","Your prediction"]}}}]},{id:"phase5",title:"Phase 5 — Sequential Data",subtitle:"Then we'll learn:",topics:[{id:"rnn",title:"RNN (Recurrent Neural Network)",content:`RNNs are designed for sequential data \u{2014} text, audio, time series \u{2014} where order matters and context from earlier elements should influence how later ones are processed.

Unlike feedforward networks, an RNN maintains a hidden state that's updated at every time step: it takes the current input and the previous hidden state, and produces both an output and an updated hidden state to carry forward. This lets information persist across the sequence.

The diagram below "unrolls" an RNN across several time steps, showing the same cell reused at each step, with the hidden state (amber pulse) flowing forward.`,viz:{type:"rnn-sequence",params:{variant:"rnn"}}},{id:"vanishing-exploding-gradients",title:"Vanishing/exploding gradients",content:`When backpropagating through many time steps (or many layers), gradients are repeatedly multiplied together. If those factors are consistently less than 1, gradients shrink exponentially toward zero (vanishing) \u{2014} early time steps effectively stop learning. If factors are consistently greater than 1, gradients grow exponentially (exploding), causing unstable, huge weight updates.

Vanilla RNNs are especially prone to vanishing gradients over long sequences, which is precisely the motivation behind LSTM and GRU architectures. Exploding gradients are commonly mitigated with gradient clipping \u{2014} simply capping gradient magnitude before applying an update.

This problem is a major reason vanilla RNNs struggle to learn long-range dependencies.`,viz:{type:"training-dynamics",params:{mode:"weight-init"}}},{id:"lstm",title:"LSTM (Long Short-Term Memory)",content:`LSTMs solve the vanishing gradient problem with a more sophisticated cell that includes a separate "cell state" \u{2014} a kind of conveyor belt that can carry information across many time steps largely unchanged \u{2014} controlled by three learned gates.

The forget gate decides what to discard from the cell state; the input gate decides what new information to add; the output gate decides what to expose as the cell's output at this time step. These gates are themselves small neural network layers, learned during training.

LSTMs can capture much longer-range dependencies than vanilla RNNs and were the dominant sequence architecture before transformers.`,viz:{type:"rnn-sequence",params:{variant:"lstm"}}},{id:"gru",title:"GRU (Gated Recurrent Unit)",content:`GRUs are a simplified alternative to LSTMs, combining the forget and input gates into a single "update gate" and merging the cell state and hidden state into one. This gives GRUs fewer parameters and makes them somewhat faster to train.

In practice, GRUs and LSTMs often perform comparably, with GRUs sometimes preferred for smaller datasets or when training speed matters more than squeezing out the last bit of accuracy on very long sequences.

Both remain useful today for smaller-scale or resource-constrained sequence tasks, even though transformers dominate large-scale sequence modeling.`,viz:{type:"rnn-sequence",params:{variant:"gru"}}},{id:"sequence-prediction",title:"Sequence prediction",content:`Sequence prediction tasks come in several shapes: many-to-one (a whole sequence produces one output, like sentiment classification), one-to-many (one input generates a sequence, like image captioning), and many-to-many (sequence in, sequence out, like translation).

Recurrent architectures naturally handle all of these by design \u{2014} the same cell structure is just applied and read out differently depending on where inputs and outputs are attached to the unrolled sequence.

Understanding which shape your task falls into is the first step in designing the right sequence model.`,viz:{type:"rnn-sequence",params:{variant:"rnn",steps:6}}},{id:"time-series-applications",title:"Time-series applications",content:`Time-series forecasting predicts future values based on historical patterns \u{2014} stock prices, weather, sensor readings, demand forecasting. Recurrent networks (and increasingly transformers) are a natural fit because they process temporally-ordered data and can learn trends, seasonality, and dependencies across time.

Practical time-series modeling requires care beyond just picking an architecture: handling missing values, choosing an appropriate window size, avoiding data leakage from the future into training data, and picking evaluation metrics that reflect real forecasting error rather than just fitting noise.

Classical statistical methods (ARIMA, exponential smoothing) are still strong, simple baselines worth comparing against any deep learning approach.`,viz:{type:"rnn-sequence",params:{variant:"lstm",steps:6}}},{id:"text-classification",title:"Text classification",content:`Text classification assigns categories to text \u{2014} sentiment analysis, spam detection, topic labeling. Text must first be converted into numbers: tokenized into words or subwords, then mapped to vectors via embeddings that capture semantic meaning.

A recurrent network (or transformer) processes this sequence of embeddings, and a final classification layer maps the resulting representation to class probabilities, similar to image classification's classifier head.

This task is a natural bridge from sequence modeling into the broader field of natural language processing, and a common first NLP project.`,viz:{type:"pipeline-flow",params:{stages:["Raw text","Tokenize","Embed","RNN / Transformer","Classifier","Prediction"]}}}]},{id:"phase6",title:"Phase 6 — Transformers",subtitle:"This is where modern AI gets really interesting. We'll understand:",topics:[{id:"attention",title:"Attention",content:`Attention lets a model dynamically decide which parts of the input are most relevant when producing each part of the output \u{2014} instead of forcing all information through a single fixed-size hidden state, as RNNs do.

For each output position, attention computes a weighted combination of all input positions, where the weights reflect learned relevance. This solves the "long-range dependency" bottleneck that plagued RNNs, since every position can directly access every other position regardless of distance.

The visualization below shows this directly: brighter connecting lines mean stronger attention weight from a query token to a key token.`,viz:{type:"attention"},starred:!0},{id:"self-attention",title:"Self-attention",content:`Self-attention is attention applied within a single sequence \u{2014} each token attends to every other token in the same sequence (including itself) to build a context-aware representation.

For example, in "the animal didn't cross the street because it was too tired," self-attention lets the representation of "it" directly incorporate information from "animal," resolving what "it" refers to \u{2014} something a fixed-window model would struggle with.

This mechanism, applied in parallel across all tokens simultaneously (not sequentially like an RNN), is the foundational building block of the transformer architecture.`,viz:{type:"attention",params:{tokens:["The","animal","was","too","tired"]}}},{id:"query-key-value",title:"Query, Key, Value",content:`Attention is computed using three learned linear projections of each token's embedding: a Query (what am I looking for?), a Key (what do I contain?), and a Value (what information do I actually offer?).

The attention weight between a query and a key is computed via their dot product (how well they "match"), scaled and passed through softmax to form a probability distribution. The output for each position is then a weighted sum of all Values, using those attention weights.

This Q/K/V framing \u{2014} borrowed loosely from information retrieval \u{2014} is what makes attention both flexible and interpretable: you can literally inspect which keys a given query attended to most strongly.`,viz:{type:"attention"}},{id:"multi-head-attention",title:"Multi-head attention",content:`Rather than computing a single attention pattern, transformers compute several in parallel \u{2014} "heads" \u{2014} each with its own learned Q/K/V projections, then concatenate their outputs and project back to the original dimension.

Different heads can specialize in capturing different kinds of relationships: one head might track syntactic dependencies, another might track coreference (like "it" referring to "animal"), another might track positional proximity. This gives the model a richer, multi-faceted view of relationships within the sequence than a single attention pattern could provide.

Typical transformer models use 8-96+ heads depending on model size.`,viz:{type:"attention",params:{heads:4}}},{id:"positional-encoding",title:"Positional encoding",content:`Self-attention itself is order-agnostic \u{2014} it treats the input as an unordered set of tokens, since attention weights only depend on content, not position. But word order obviously matters ("dog bites man" \u{2260} "man bites dog"), so transformers need an explicit way to inject position information.

Positional encoding adds a unique, deterministic (or sometimes learned) vector to each token's embedding based on its position in the sequence, typically using sine and cosine functions at different frequencies. This lets the model distinguish "first token" from "fifth token" even though attention itself doesn't inherently track order.

Without positional encoding, a transformer literally cannot tell word order apart.`,viz:{type:"concept-graph",params:{concepts:[{name:"Token embedding",detail:"Meaning, no order info"},{name:"Positional vector",detail:"Encodes position via sin/cos"},{name:"Combined input",detail:"Embedding + position, fed to attention"}]}}},{id:"encoder",title:"Encoder",content:`The encoder's job is to build a rich, context-aware representation of the entire input sequence. Each encoder layer consists of a self-attention block (letting every token gather context from every other token) followed by a feed-forward network, with residual connections and normalization around each.

Encoders are bidirectional \u{2014} every token can attend to every other token regardless of position, both before and after it \u{2014} which makes encoder-only models (like BERT) especially strong for understanding tasks: classification, extraction, embeddings.

Stacking multiple encoder layers lets the model build increasingly abstract representations, similar to how deeper CNN layers build increasingly abstract visual features.`,viz:{type:"transformer-stack",params:{showDecoder:!1}}},{id:"decoder",title:"Decoder",content:`The decoder generates output one token at a time, attending to both previously generated output tokens (via masked self-attention, which prevents "cheating" by looking at future tokens) and \u{2014} in encoder-decoder models \u{2014} the encoder's output (via cross-attention).

This causal masking is what makes decoders suitable for generation: at training time, the model can process an entire target sequence in parallel while still only "seeing" past tokens for each prediction, thanks to the mask.

Decoder-only models (like GPT) drop the separate encoder entirely and rely purely on this masked self-attention over the growing generated sequence \u{2014} which turns out to be sufficient for extremely capable language generation.`,viz:{type:"transformer-stack",params:{showDecoder:!0,layers:2}}},{id:"transformer-architecture",title:"Transformer architecture",content:`The full transformer, as introduced in "Attention Is All You Need" (2017), combines stacked encoder layers and stacked decoder layers connected via cross-attention \u{2014} originally designed for machine translation.

Data flows: input tokens \u{2192} embeddings + positional encoding \u{2192} encoder stack (builds context-rich representations) \u{2192} decoder stack (generates output tokens autoregressively, attending back to encoder output at each step) \u{2192} output probabilities.

This architecture, and its encoder-only (BERT) and decoder-only (GPT) simplifications, now underlies nearly all state-of-the-art NLP and multimodal AI systems.`,viz:{type:"transformer-stack",params:{showDecoder:!0,layers:3}},starred:!0},{id:"bert-style-models",title:"BERT-style models",content:`BERT (Bidirectional Encoder Representations from Transformers) uses only the encoder stack, trained with a "masked language modeling" objective: randomly hide some tokens in a sentence and train the model to predict them using context from both directions.

This bidirectional context makes BERT-style models excellent at understanding tasks \u{2014} question answering, sentiment analysis, named entity recognition, semantic search \u{2014} where you need a rich representation of a complete piece of text rather than generating new text.

BERT-style models are typically fine-tuned: pretrained on massive unlabeled text, then adapted to a specific task with a smaller labeled dataset and an additional small output layer.`,viz:{type:"transformer-stack",params:{showDecoder:!1,layers:3}}},{id:"gpt-style-models",title:"GPT-style models",content:`GPT (Generative Pretrained Transformer) uses only the decoder stack with masked (causal) self-attention, trained on a simple objective: predict the next token given all previous tokens. This "autoregressive" setup is what lets GPT-style models generate fluent, coherent text one token at a time.

Because next-token prediction requires no labels beyond the raw text itself, these models can be pretrained on enormous, largely unlabeled text corpora, then adapted through fine-tuning or prompting to a huge range of downstream tasks \u{2014} including the conversational assistant generating some of these lessons.

Scaling up GPT-style architectures in size and training data, largely without fundamental architecture changes, has been the primary driver behind the rapid capability gains in modern large language models.`,viz:{type:"transformer-stack",params:{showDecoder:!0,layers:4}}}]}],li=ln.flatMap(e=>e.topics);(0,p.createRoot)(document.getElementById("root")).render((0,d.jsx)(h.StrictMode,{children:(0,d.jsx)(function(){let[e,t]=(0,h.useState)(ln),[n,i]=(0,h.useState)(()=>Object.fromEntries(li.map(e=>[e.id,e]))),[r,a]=(0,h.useState)(new Set),[s,o]=(0,h.useState)("home"),[l,c]=(0,h.useState)(null),u=(0,h.useMemo)(()=>e.flatMap(e=>e.topics.map(e=>e.id)),[e]),p=e=>{c(e),o("topic")},f=l?n[l]:null,m=l?u.indexOf(l):-1,g=m>0?u[m-1]:null,v=m>=0&&m<u.length-1?u[m+1]:null,y=e.reduce((e,t)=>e+t.topics.length,0);return(0,d.jsxs)("div",{className:"min-h-screen flex bg-stone-50",children:[(0,d.jsx)(e4,{phases:e,currentTopicId:l,completedIds:r,onSelectTopic:p,onSelectHome:()=>o("home"),onSelectUpload:()=>o("upload"),view:s}),(0,d.jsxs)("main",{className:"flex-1 min-w-0",children:["home"===s&&(0,d.jsxs)("div",{className:"max-w-5xl mx-auto px-8 py-12",children:[(0,d.jsxs)("div",{className:"mb-10",children:[(0,d.jsx)("h1",{className:"text-3xl font-bold text-stone-900 mb-2",children:"Deep Learning, from perceptron to GPT"}),(0,d.jsxs)("p",{className:"text-stone-600 max-w-2xl",children:["A complete, hands-on course: ",y,' topics across six phases, each with a 3D visualization built for that specific idea — not a repeated diagram. Every lesson is editable, and you can turn your own notes into new lessons in "Upload & generate."']})]}),(0,d.jsx)("div",{className:"space-y-6",children:e.map(e=>{let i=e.topics.filter(e=>r.has(e.id)).length;return(0,d.jsx)(eO,{className:"border-stone-200",children:(0,d.jsxs)(eB,{className:"pt-6",children:[(0,d.jsxs)("div",{className:"flex items-center justify-between mb-1",children:[(0,d.jsx)("h2",{className:"text-lg font-semibold text-stone-900",children:e.title}),(0
