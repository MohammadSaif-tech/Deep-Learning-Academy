class TinyNetwork:
    def __init__(self, in_dim, hidden_dim, out_dim):
        self.W1 = np.random.randn(in_dim, hidden_dim) * 0.1
        self.b1 = np.zeros(hidden_dim)
        self.W2 = np.random.randn(hidden_dim, out_dim) * 0.1
        self.b2 = np.zeros(out_dim)

    def forward(self, x):
        self.z1 = x @ self.W1 + self.b1
        self.a1 = np.maximum(0, self.z1)  # ReLU
        self.z2 = self.a1 @ self.W2 + self.b2
        return 1 / (1 + np.exp(-self.z2))  # sigmoid

    def backward(self, x, y, out, lr=0.01):
        grad_out = out - y
        grad_W2 = self.a1.T @ grad_out
        grad_a1 = grad_out @ self.W2.T
        grad_z1 = grad_a1 * (self.z1 > 0)

"],correctIndex:1,explanation:"Dendrite connection strength is loosely mirrored by the learnable weight applied to each input in an artificial neuron."},{question:'What triggers a biological neuron to "fire" an output pulse?',options:["A random timer","The combined incoming signal exceeding a threshold","External temperature changes","It fires constantly regardless of input"],correctIndex:1,explanation:"A biological neuron fires when the combined signal from its dendrites is strong enough to cross a threshold — mirrored by activation functions."}],perceptron:[{question:"What can a single perceptron NOT solve?",options:["Any linearly separable problem","The XOR problem (non-linearly-separable data)","Simple AND/OR logic gates","Binary classification with a straight-line boundary"],correctIndex:1,explanation:"A single perceptron can only learn a linear decision boundary, so it fails on non-linearly-separable problems like XOR."},{question:"A perceptron computes a weighted sum plus bias, then applies what kind of function?",options:["A sorting function","A step (threshold) function","A database lookup","A random number generator"],correctIndex:1,explanation:"The classic perceptron uses a step function: output 1 if the weighted sum + bias crosses a threshold, else 0."}],"weights-bias":[{question:"What does a weight close to zero mean for an input?",options:["That input is very important","That input has little influence on the neuron's output","The input is invalid","The neuron will always fire"],correctIndex:1,explanation:"A near-zero weight means that particular input barely affects the weighted sum, so it has little influence on the output."},{question:"What is the role of the bias term?",options:["It scales one specific input","It shifts the decision boundary independently of the inputs","It removes the need for weights","It only applies during testing"],correctIndex:1,explanation:"Bias is added after the weighted sum and lets the neuron fire even with all-zero inputs, shifting the boundary."}],"activation-functions":[{question:"Why are activation functions necessary in a neural network?",options:["They make training slower on purpose","Without them, stacking layers would collapse into a single linear transformation","They store the training data","They are only needed for image tasks"],correctIndex:1,explanation:"Non-linear activation functions let deep networks represent complex, non-linear relationships; without them, layers reduce to one linear function."},{question:"Which activation function is the most common default choice for hidden layers today?",options:["Sigmoid","Softmax","ReLU","Step function"],correctIndex:2,explanation:"ReLU (max(0, x)) is simple, fast, and avoids vanishing gradients for positive inputs, making it the standard hidden-layer choice."}],"forward-propagation":[{question:"What happens during forward propagation?",options:["Gradients are computed backward through the network","Data flows through the network from input to output to produce a prediction","Weights are randomly reinitialized","The dataset is shuffled"],correctIndex:1,explanation:"Forward propagation is simply running input data through the network layer by layer to produce an output/prediction."},{question:"Is forward propagation used only during training?",options:["Yes, only during training","No — it also happens whenever an already-trained model makes a prediction (inference)","No, only during backpropagation","Forward propagation does not exist in inference"],correctIndex:1,explanation:"The same forward-pass computation happens during both training and inference (using a trained model to predict)."}],"loss-functions-p1":[{question:"What does a loss function measure?",options:["How fast the model runs","How wrong the model's predictions are, as a single number to minimize","The number of layers in the network","The size of the dataset"],correctIndex:1,explanation:"A loss function converts prediction error into a scalar value that training tries to minimize."},{question:"Which loss is typically used for classification tasks?",options:["Mean Squared Error","Cross-entropy loss","Cosine similarity","Manhattan distance"],correctIndex:1,explanation:"Cross-entropy loss compares predicted class probabilities to the true label and is standard for classification."}],"gradient-descent":[{question:"What does the gradient of the loss function tell you?",options:["The exact minimum loss value","The direction of steepest increase in loss","The number of training examples","The batch size to use"],correctIndex:1,explanation:"The gradient points toward the steepest increase in loss, so gradient descent moves weights in the opposite direction."},{question:"In the 3D visualization, what does the ball rolling downhill represent?",options:["The training data","The current model parameters (weights) being optimized","The loss function itself","A random particle with no meaning"],correctIndex:1,explanation:"The ball represents the current weight values, moving downhill (toward lower loss) as gradient descent updates them."}],backpropagation:[{question:"What mathematical rule does backpropagation rely on?",options:["The Pythagorean theorem","The chain rule from calculus","Bayes' theorem","Linear regression"],correctIndex:1,explanation:"Backpropagation uses the chain rule to compute how much each weight contributed to the final loss, layer by layer."},{question:"In what direction does backpropagation compute gradients through the network?",options:["Forward, from input to output","Backward, from the output/loss toward earlier layers","Randomly, in no particular order","Only within a single layer"],correctIndex:1,explanation:"Backpropagation works backward from the loss, computing each layer's gradient based on the gradients of layers after it."}],"learning-rate":[{question:"What happens if the learning rate is set too high?",options:["Training converges instantly","Updates can overshoot the minimum, causing loss to oscillate or diverge","The model becomes immune to overfitting","Nothing changes"],correctIndex:1,explanation:"A too-high learning rate causes large weight updates that can overshoot the minimum and destabilize training."},{question:"What is a downside of setting the learning rate too low?",options:["The model trains instantly","Training can be extremely slow or get stuck in a shallow local minimum","It guarantees the best possible model","It has no downsides"],correctIndex:1,explanation:"A too-low learning rate makes training crawl, potentially taking impractically long or stalling in a poor local minimum."}],"epochs-batches-iterations":[{question:"What is one epoch?",options:["One weight update","One full pass through the entire training dataset","One test example","One layer of the network"],correctIndex:1,explanation:"An epoch means the model has seen every training example once."},{question:"With 1,000 examples and a batch size of 100, how many iterations make up one epoch?",options:["1","10","100","1000"],correctIndex:1,explanation:"1000 examples / 100 per batch = 10 batches = 10 iterations per epoch."}],"nn-from-scratch":[{question:"What is the main benefit of implementing a neural network from scratch with NumPy?",options:["It runs faster than PyTorch","It builds real intuition for what frameworks like PyTorch do automatically","It requires no math at all","It is required before you can use any framework"],correctIndex:1,explanation:"Manually implementing forward/backward passes demystifies what high-level frameworks automate, making later tools easier to understand."},{question:"When implementing backprop manually, what do you compute by hand?",options:["Random numbers","Gradients via the chain rule for each weight","The dataset labels","The GPU driver version"],correctIndex:1,explanation:"From-scratch implementations require manually applying the chain rule to compute gradients for every weight."}],"binary-classification":[{question:"What activation is typically used in the output layer for binary classification?",options:["ReLU","Sigmoid","Tanh","Linear"],correctIndex:1,explanation:"Sigmoid squashes output to (0,1), interpretable as the probability of the positive class."},{question:"What loss function pairs naturally with binary classification?",options:["Mean Squared Error","Binary cross-entropy","Hinge loss only","KL divergence only"],correctIndex:1,explanation:"Binary cross-entropy strongly penalizes confident wrong predictions and matches the sigmoid output well."}],"multiclass-classification":[{question:"How many output neurons does a multiclass classifier typically have?",options:["Always 1","One per class","Always 2","Equal to the batch size"],correctIndex:1,explanation:"Multiclass classification uses one output neuron per class, with softmax turning scores into probabilities."},{question:"What does softmax guarantee about its outputs?",options:["They sum to 1 and form a probability distribution","They are always exactly 0 or 1","They are unrelated to each other","They can be negative"],correctIndex:0,explanation:"Softmax converts raw scores into a probability distribution over classes that sums to 1."}],"mini-batch-gradient-descent":[{question:"What is the key advantage of mini-batch gradient descent over full-batch gradient descent?",options:["It always gives a lower final loss","It balances computational efficiency, memory use, and gradient stability","It removes the need for a loss function","It requires no shuffling"],correctIndex:1,explanation:"Mini-batches are a practical middle ground between full-batch (accurate but slow) and single-example SGD (fast but noisy)."},{question:"What is a batch size?",options:["The total number of epochs","The number of examples processed together in one forward/backward pass","The number of layers in the model","The learning rate value"],correctIndex:1,explanation:"Batch size is how many examples are grouped together for one gradient computation and weight update."}],"validation-test-sets":[{question:"When should the test set be used?",options:["Repeatedly, to guide every design decision","Exactly once, at the very end, to report final performance","Never — it is just for storage","Only during training"],correctIndex:1,explanation:"The test set must stay untouched until final evaluation; using it repeatedly leaks information and inflates performance estimates."},{question:"What is the validation set primarily used for?",options:["Updating model weights directly","Tuning hyperparameters and monitoring overfitting during development","Storing the final model","Nothing — it is optional and unused"],correctIndex:1,explanation:"Validation data acts as a proxy for unseen data during development, guiding hyperparameter choices."}],overfitting:[{question:"What is the classic signature of overfitting on a loss chart?",options:["Both training and validation loss decrease together forever","Training loss keeps dropping while validation loss rises after a point","Training loss is always higher than validation loss","Neither loss ever changes"],correctIndex:1,explanation:"Overfitting shows as training and validation loss diverging — training keeps improving while validation gets worse."},{question:"What commonly causes overfitting?",options:["Too little model complexity relative to data","A model too complex relative to available data, or training too long without regularization","Using a validation set","Using data augmentation"],correctIndex:1,explanation:"Overfitting often results from excessive model complexity or over-training without adequate regularization."}],regularization:[{question:"What is the general goal of regularization techniques?",options:["Make the model perfectly fit the training data","Discourage overfitting to improve generalization to unseen data","Increase training speed only","Remove the need for a validation set"],correctIndex:1,explanation:"Regularization constrains model complexity to encourage better generalization, sometimes at the cost of training fit."},{question:"Which of these is a regularization technique?",options:["Increasing batch size only","Dropout","Using a bigger dataset only","Removing the loss function"],correctIndex:1,explanation:"Dropout randomly disables neurons during training, which is a well-known regularization technique."}],dropout:[{question:"What happens to dropout during inference (test time)?",options:["It stays fully active, same as training","It is turned off — all neurons are active","Dropout only exists at test time","The network is deleted"],correctIndex:1,explanation:"Dropout is used only during training; at inference all neurons are active (often with rescaled outputs)."},{question:"Why does dropout help generalization?",options:["It effectively trains an ensemble of overlapping sub-networks","It removes all randomness from training","It guarantees zero training loss","It increases the number of parameters"],correctIndex:0,explanation:"Randomly dropping different neurons each step approximates training many overlapping sub-networks, improving generalization."}],"batch-normalization":[{question:"What does batch normalization do to activations within a layer?",options:["Deletes them","Rescales them to roughly zero mean and unit variance, then applies a learnable scale/shift","Doubles them","Sorts them by value"],correctIndex:1,explanation:"Batch norm normalizes activation statistics per mini-batch, then applies a learnable affine transform."},{question:"What problem does batch normalization primarily address?",options:["Slow internet connections",'Unstable, shifting activation distributions during training ("internal covariate shift")',"Missing training data","Too few GPUs"],correctIndex:1,explanation:"Batch norm stabilizes activation distributions across training, which speeds up and stabilizes learning."}],"weight-initialization":[{question:"Why is initializing all weights to zero problematic?",options:["It is actually the best approach","Every neuron in a layer computes identical gradients and never differentiates","It makes training instant","It has no effect on training"],correctIndex:1,explanation:"With all-zero weights, neurons in the same layer stay symmetric and learn identical features, wasting capacity."},{question:"What do schemes like Xavier/He initialization do?",options:["Set all weights to 1","Scale initial random weights based on layer input/output size to keep activations in a healthy range","Remove the need for an activation function","Only apply to the output layer"],correctIndex:1,explanation:"Xavier and He initialization scale weight variance based on layer size, helping avoid vanishing/exploding activations early in training."}],"pytorch-workflow":[{question:'What is a key philosophical difference between PyTorch and high-level "just call .fit()" APIs?',options:["PyTorch cannot train models at all","PyTorch expects you to write the training loop yourself, giving full visibility and control","PyTorch has no concept of a model","PyTorch only works with images"],correctIndex:1,explanation:"PyTorch's explicit training loop gives you fine-grained control at the cost of writing more code than a single .fit() call."},{question:"Which of the following is NOT one of the standard PyTorch pipeline stages?",options:["Dataset","DataLoader","Optimizer","Spreadsheet"],correctIndex:3,explanation:"The standard pipeline is Tensor → Dataset → DataLoader → Model → Loss → Optimizer → Training loop → Evaluation."}],tensor:[{question:"What two capabilities does a PyTorch Tensor have beyond a plain NumPy array?",options:["It can be printed and deleted","It can run on a GPU and automatically track gradients via autograd","It can only hold integers","It cannot be reshaped"],correctIndex:1,explanation:"Tensors support GPU acceleration and automatic differentiation, which NumPy arrays lack."},{question:"Setting requires_grad=True on a tensor does what?",options:["Deletes the tensor after use","Tells PyTorch to record operations on it so gradients can be computed later","Converts it to a NumPy array","Freezes its values permanently"],correctIndex:1,explanation:"requires_grad=True enables PyTorch's autograd to track the computation graph for that tensor."}],dataset:[{question:"What two methods must a custom PyTorch Dataset implement?",options:["__init__ and __del__","__len__ and __getitem__","__str__ and __repr__","forward and backward"],correctIndex:1,explanation:"__len__ reports the number of examples; __getitem__ fetches and preprocesses one example given an index."},{question:"What does the Dataset abstraction separate from batching logic?",options:["Nothing, they are the same","How individual examples are accessed/preprocessed","The GPU driver","The optimizer"],correctIndex:1,explanation:"Dataset handles per-example access and preprocessing, while DataLoader handles batching/shuffling."}],dataloader:[{question:"What does shuffle=True in a DataLoader help prevent?",options:["GPU overheating","The model learning spurious patterns based on data order","Running out of disk space","Gradient computation errors"],correctIndex:1,explanation:"Shuffling each epoch prevents the model from exploiting arbitrary ordering artifacts in the dataset."},{question:"What does the num_workers parameter control?",options:["The number of GPUs used for training","How many CPU processes prepare batches in parallel","The number of output classes","The learning rate schedule"],correctIndex:1,explanation:"num_workers enables parallel CPU data loading so it doesn't bottleneck GPU training."}],model:[{question:"What must a custom PyTorch model subclass?",options:["nn.Dataset","nn.Module","nn.Optimizer","nn.Loss"],correctIndex:1,explanation:"Custom models subclass nn.Module, defining layers in __init__ and computation in forward."},{question:"How does PyTorch know which values are learnable parameters?",options:["You must list them manually every time","nn.Module automatically tracks parameters declared within it","It guesses randomly","Parameters must be global variables"],correctIndex:1,explanation:"nn.Module automatically registers parameters of layers defined within it, accessible via model.parameters()."}],"loss-pytorch":[{question:"What does calling .backward() on a loss tensor trigger?",options:["Deletion of the model","Backpropagation through the entire computation graph","A forward pass only","Saving the model to disk"],correctIndex:1,explanation:".backward() computes gradients for all tensors with requires_grad=True via automatic differentiation."},{question:"Which PyTorch loss is standard for multiclass classification?",options:["nn.MSELoss","nn.CrossEntropyLoss","nn.L1Loss","nn.CosineSimilarity"],correctIndex:1,explanation:"nn.CrossEntropyLoss is the standard choice for multiclass classification with raw logits as input."}],optimizer:[{question:"What is a very common bug related to PyTorch optimizers?",options:["Calling optimizer.step() too many times","Forgetting optimizer.zero_grad(), causing gradients to accumulate","Using too few optimizers","Not importing NumPy"],correctIndex:1,explanation:"Gradients accumulate by default in PyTorch, so forgetting zero_grad() before backward() leads to incorrect updates."},{question:"What is the most commonly used default optimizer in modern deep learning?",options:["Plain SGD without momentum","Adam","Random search","Newton's method"],correctIndex:1,explanation:"Adam adapts learning rates per-parameter and is the most common default optimizer today."}],"training-loop":[{question:"What is the correct order of operations within one training step?",options:["backward() → zero_grad() → forward pass → step()","zero_grad() → forward pass → compute loss → backward() → step()","step() → zero_grad() → forward pass","forward pass → step() → backward()"],correctIndex:1,explanation:"The standard order is: clear old gradients, run forward pass, compute loss, backpropagate, then update weights."},{question:"Why does PyTorch require writing the training loop explicitly?",options:["It is a limitation with no benefit","It lets you easily add custom logic like logging or gradient clipping without fighting an abstraction","It is required by law","It makes models train faster automatically"],correctIndex:1,explanation:"An explicit loop gives full flexibility to insert custom behavior anywhere in the training process."}],evaluation:[{question:"Why do you call model.eval() before evaluation?",options:["To delete the model","To switch off training-only behaviors like dropout and batch norm's batch statistics","To start training","It has no effect"],correctIndex:1,explanation:"model.eval() disables dropout and switches batch norm to use running statistics instead of batch statistics."},{question:"What does wrapping evaluation in torch.no_grad() do?",options:["Speeds up training by adding more gradients","Skips gradient tracking, saving memory and computation since no backward pass is needed","Deletes the validation set","Forces the model into training mode"],correctIndex:1,explanation:"torch.no_grad() disables gradient tracking, which isn't needed during evaluation and saves resources."}],convolution:[{question:"What does a convolutional filter do as it slides across an image?",options:["It deletes pixels randomly","It computes a weighted sum at each position to detect a local pattern","It sorts the pixels","It converts the image to grayscale only"],correctIndex:1,explanation:"Convolution computes weighted sums over local regions as the filter slides, detecting patterns like edges or textures."},{question:"Why does convolution use far fewer parameters than a fully-connected layer processing the whole image?",options:["It uses no parameters at all","The same filter (small set of weights) is reused across every position","It only looks at one pixel","It requires more parameters, not fewer"],correctIndex:1,explanation:"Weight sharing — reusing the same small filter everywhere — massively reduces parameter count versus full connectivity."}],"filters-kernels":[{question:"What do early-layer filters in a CNN typically learn to detect?",options:["Whole objects","Simple, low-level patterns like edges and color contrasts","Text in a document","GPS coordinates"],correctIndex:1,explanation:"Early convolutional layers tend to learn generic, low-level features like edges and textures."},{question:"How are CNN filters typically obtained?",options:["Hand-designed by engineers","Learned automatically from data during training","Randomly generated and never updated","Copied from a lookup table"],correctIndex:1,explanation:"Unlike traditional computer vision, CNN filters are learned parameters optimized during training."}],padding:[{question:'What does "same" padding aim to preserve?',options:["The number of channels","The spatial width/height of the output relative to the input","The learning rate","The batch size"],correctIndex:1,explanation:'"Same" padding adds enough border pixels so the output has the same spatial dimensions as the input.'},{question:'What happens without any padding ("valid" padding)?',options:["Output size stays exactly the same as input","Output spatial dimensions shrink after convolution","The image is deleted","Nothing changes"],correctIndex:1,explanation:"Without padding, each convolution reduces spatial dimensions since the filter can't center on edge pixels."}],stride:[{question:"What does a stride of 2 do compared to a stride of 1?",options:["Moves the filter twice as slowly","Skips every other position, roughly halving output width/height","Doubles the number of filters","Has no effect on output size"],correctIndex:1,explanation:"A larger stride skips positions, reducing the output feature map's spatial size."},{question:"What is a risk of using too large a stride?",options:["It always improves accuracy","Important details between sampled positions can be skipped over","Training becomes impossible","It has no risks"],correctIndex:1,explanation:"Large strides can miss fine-grained spatial detail by skipping over positions between samples."}],pooling:[{question:"What does max pooling keep from each window?",options:["The average value","The maximum value","The minimum value","A random value"],correctIndex:1,explanation:"Max pooling keeps only the strongest (maximum) activation within each pooling window."},{question:"What is one benefit of pooling besides reducing computation?",options:["It increases image resolution","It provides some translation invariance to small shifts in the input","It removes the need for convolution","It guarantees zero overfitting"],correctIndex:1,explanation:"Pooling makes the representation somewhat robust to small translations, since nearby positions summarize to the same max/average."}],"feature-maps":[{question:"What does a feature map show?",options:["The raw, unprocessed image only","Where and how strongly one filter's pattern was detected across the input","The model's final prediction","The batch size used in training"],correctIndex:1,explanation:"A feature map is the 2D output of applying one filter across the entire input, showing detection strength spatially."},{question:"How do deeper-layer feature maps typically differ from early-layer ones?",options:["They are always identical","They respond to increasingly abstract, composite patterns","They only detect color","They have no relationship to earlier layers"],correctIndex:1,explanation:"Deeper layers build on earlier features to detect more abstract, composite patterns like object parts."}],"cnn-architecture":[{question:"What is the typical order of a classic CNN architecture block?",options:["Classifier → Convolution → Pooling","Convolution → Activation → Pooling, repeated, then flatten and classify","Flatten → Convolution → Classifier","Pooling → Classifier → Convolution"],correctIndex:1,explanation:"CNNs typically stack conv+activation+pooling blocks, then flatten features into fully-connected classifier layers."},{question:"What happens to spatial size and channel count as you go deeper in a typical CNN?",options:["Spatial size increases, channels decrease","Spatial size decreases, channel/filter count typically increases","Both stay exactly constant","Both always decrease to zero"],correctIndex:1,explanation:"Deeper layers usually have smaller spatial maps but more channels, capturing more abstract features per position."}],"image-classification":[{question:"What breakthrough popularized CNNs for image classification in 2012?",options:["ImageNet and AlexNet","The invention of Python","The first camera","GPT-1"],correctIndex:0,explanation:"AlexNet's 2012 ImageNet win was a landmark moment that popularized deep CNNs for vision tasks."},{question:"What can still fool modern, highly accurate image classifiers?",options:["Nothing, they are perfect","Adversarial examples and out-of-distribution images","Only black and white images","Images larger than 10MB"],correctIndex:1,explanation:"Even highly accurate classifiers remain vulnerable to adversarial perturbations and genuinely novel inputs."}],"data-augmentation":[{question:"What is data augmentation?",options:["Deleting parts of the dataset","Applying random, label-preserving transformations to expand the training set","Buying more GPUs","Reducing the number of training examples"],correctIndex:1,explanation:"Data augmentation applies transformations like rotation or flipping that preserve the label but increase data variety."},{question:"When should augmentation typically be applied?",options:["Only to the test set","Only to the training set, on-the-fly during each epoch","Only to the validation set","Equally to all three sets"],correctIndex:1,explanation:"Augmentation is applied to training data only — validation and test data should reflect real, unaltered examples."}],"transfer-learning":[{question:"What is the main idea behind transfer learning?",options:["Always training a new model completely from scratch","Reusing a model pretrained on a large dataset as a starting point for a new task","Transferring files between computers","Using no training data at all"],correctIndex:1,explanation:"Transfer learning starts from a pretrained model's learned features rather than training from random weights."},{question:"What is commonly replaced/retrained when applying transfer learning?",options:["The entire pretrained network from scratch","Mainly the final classifier layers, with optional fine-tuning of earlier layers","Nothing is changed","Only the input image size"],correctIndex:1,explanation:"Typically the final layers are replaced/retrained for the new task, keeping most pretrained feature-extraction layers."}],rnn:[{question:"What does an RNN maintain across time steps that a feedforward network does not?",options:["A hidden state carrying information forward","A fixed-size image","A convolution filter","A softmax layer"],correctIndex:0,explanation:"RNNs maintain a hidden state updated at every step, letting earlier context influence later processing."},{question:"What kind of data are RNNs specifically designed for?",options:["Static images only","Sequential data like text, audio, and time series","Tabular spreadsheets only","Single unrelated data points"],correctIndex:1,explanation:"RNNs process sequences, where order and context between elements matter."}],"vanishing-exploding-gradients":[{question:"What causes vanishing gradients over long sequences?",options:["Gradients being multiplied together repeatedly by factors less than 1","Using too much data","Too high a batch size","Using ReLU everywhere"],correctIndex:0,explanation:"Repeated multiplication by factors < 1 across many steps shrinks gradients exponentially toward zero."},{question:"What is a common technique to mitigate exploding gradients?",options:["Gradient clipping","Deleting the optimizer","Using a larger learning rate","Removing all activation functions"],correctIndex:0,explanation:"Gradient clipping caps gradient magnitude before applying updates, preventing destructively large steps."}],lstm:[{question:"What does the LSTM cell state act like?",options:["A random number generator","A conveyor belt that can carry information across many time steps largely unchanged","A convolution filter","A softmax output"],correctIndex:1,explanation:"The cell state is designed to preserve information over long sequences, addressing vanishing gradients."},{question:"How many gates does a standard LSTM cell use?",options:["1","2","3","5"],correctIndex:2,explanation:"LSTMs use three gates: forget, input, and output, each controlling information flow through the cell."}],gru:[{question:"How does a GRU simplify the LSTM design?",options:["It adds more gates","It combines forget/input gates into an update gate and merges cell/hidden state","It removes all gates entirely","It only works on images"],correctIndex:1,explanation:"GRUs use fewer gates and a single combined state, giving fewer parameters than LSTMs."},{question:"How do GRUs and LSTMs typically compare in performance?",options:["GRUs are always much worse","They often perform comparably, with GRUs sometimes faster to train","LSTMs cannot be trained at all","They are mathematically identical"],correctIndex:1,explanation:"GRUs and LSTMs are often competitive with each other, with GRUs having a slight speed/parameter advantage."}],"sequence-prediction":[{question:"Which sequence task shape fits sentiment classification (whole sentence → one label)?",options:["One-to-many","Many-to-one","Many-to-many","One-to-one"],correctIndex:1,explanation:"Sentiment classification takes a full sequence input and produces a single output — many-to-one."},{question:"Which sequence task shape fits machine translation (sentence in, sentence out)?",options:["One-to-one","Many-to-one","Many-to-many","One-to-many"],correctIndex:2,explanation:"Translation maps a sequence to another sequence — many-to-many."}],"time-series-applications":[{question:"What is a key risk to avoid in time-series modeling?",options:["Using too much data","Data leakage from the future into training data","Using recurrent networks","Normalizing input values"],correctIndex:1,explanation:"Letting future information leak into training data gives falsely optimistic results and breaks real-world forecasting validity."},{question:"What is a strong, simple baseline to compare against deep learning time-series models?",options:["Random guessing","Classical statistical methods like ARIMA or exponential smoothing","A single perceptron with no training","Ignoring the data entirely"],correctIndex:1,explanation:"Classical time-series methods remain competitive baselines worth comparing against more complex models."}],"text-classification":[{question:"Before feeding text into a neural network, what must happen first?",options:["Nothing, raw text works directly","It must be tokenized and converted into numeric vectors via embeddings","It must be converted to an image","It must be translated to a fixed foreign language"],correctIndex:1,explanation:"Text is tokenized and mapped to numeric embedding vectors before any neural network can process it."},{question:"What is text classification often used for?",options:["Generating random noise","Sentiment analysis, spam detection, and topic labeling","Compressing images","Sorting numeric spreadsheets"],correctIndex:1,explanation:"Common text classification applications include sentiment analysis, spam filtering, and topic labeling."}],attention:[{question:"What core limitation of RNNs does attention address?",options:["Slow disk access","The long-range dependency bottleneck of forcing all information through a single fixed-size hidden state","Lack of GPU support","Inability to process images"],correctIndex:1,explanation:"Attention lets each output directly access all input positions, avoiding the RNN bottleneck of a single compressed hidden state."},{question:"In the attention visualization, what does line brightness/opacity represent?",options:["File size","The strength of the attention weight between a query and a key","The learning rate","The number of layers"],correctIndex:1,explanation:"Brighter/more opaque lines indicate stronger learned attention weight between a query token and a key token."}],"self-attention":[{question:"What does self-attention mean, specifically?",options:["Attention only within the model's own parameters, unrelated to input","Every token in a sequence attends to every other token in the same sequence, including itself","A model attending to a completely different sequence","A form of unsupervised clustering"],correctIndex:1,explanation:"Self-attention computes relevance between all pairs of tokens within one sequence to build context-aware representations."},{question:"What classic example does self-attention help resolve?",options:["Image resolution",'Coreference, like understanding what "it" refers to in a sentence',"File compression ratios","GPU memory allocation"],correctIndex:1,explanation:'Self-attention lets a pronoun like "it" directly incorporate context from the noun it refers to, aiding disambiguation.'}],"query-key-value":[{question:"In the Q/K/V framing, what determines the attention weight between two tokens?",options:["A random number","The dot product between one token's Query and another's Key, scaled and softmaxed","The token's position in the alphabet","The total sequence length only"],correctIndex:1,explanation:"Attention weight comes from how well a Query matches a Key via dot product, normalized with softmax."},{question:"What does the Value vector represent?",options:["What information a token actually offers if attended to","The token's position index","The learning rate for that token","A random placeholder with no meaning"],correctIndex:0,explanation:"The Value is the actual content contributed to the output when a token is attended to."}],"multi-head-attention":[{question:"Why do transformers use multiple attention heads instead of one?",options:["To slow down training intentionally","Different heads can specialize in capturing different kinds of relationships","It reduces the model to a single linear layer","It removes the need for positional encoding"],correctIndex:1,explanation:"Multiple heads let the model attend to different relationship types (syntax, coreference, position) in parallel."},{question:"What happens to the outputs of multiple attention heads?",options:["They are discarded except for one","They are concatenated and projected back to the original dimension","They are averaged with the input embeddings only","They replace the Query vectors"],correctIndex:1,explanation:"Multi-head outputs are concatenated then linearly projected back to the model's working dimension."}],"positional-encoding":[{question:"Why do transformers need positional encoding?",options:["Self-attention is inherently order-agnostic and needs explicit position information","It is purely decorative and has no functional purpose","To reduce the number of parameters","To replace the need for embeddings"],correctIndex:0,explanation:"Attention weights depend only on content, not position, so position must be explicitly injected into the input."},{question:"What mathematical functions does the original transformer use for positional encoding?",options:["Logarithms","Sine and cosine functions at different frequencies","Square roots only","Random noise"],correctIndex:1,explanation:"The original transformer paper used sine/cosine functions at varying frequencies to encode position."}],encoder:[{question:'What does "bidirectional" mean for encoder self-attention?',options:["It can only see past tokens","Every token can attend to every other token regardless of position, before or after","It processes text backward only","It has two separate models"],correctIndex:1,explanation:"Encoders are bidirectional — attention isn't restricted by token order, unlike a decoder's causal mask."},{question:"Which model family is a well-known encoder-only architecture?",options:["GPT","BERT","AlexNet","ResNet"],correctIndex:1,explanation:"BERT uses only the transformer encoder stack, well-suited for understanding tasks."}],decoder:[{question:"What does masked self-attention prevent in a decoder?",options:["Attending to any tokens at all","Looking ahead at future tokens during generation","Using the encoder output","Learning any patterns"],correctIndex:1,explanation:"Causal masking blocks a position from attending to future tokens, essential for valid autoregressive generation."},{question:"What is cross-attention used for in an encoder-decoder model?",options:["Letting the decoder attend to the encoder's output","Letting the encoder attend to itself only","Replacing positional encoding","Normalizing gradients"],correctIndex:0,explanation:"Cross-attention lets each decoder layer incorporate information from the encoder's representation of the input."}],"transformer-architecture":[{question:"What paper introduced the transformer architecture?",options:['"ImageNet Classification with Deep CNNs"','"Attention Is All You Need"','"Playing Atari with Deep RL"','"A Few Useful Things to Know about ML"'],correctIndex:1,explanation:'"Attention Is All You Need" (2017) introduced the full transformer encoder-decoder architecture.'},{question:"What was the original transformer designed for?",options:["Image classification","Machine translation","Speech synthesis","Video compression"],correctIndex:1,explanation:"The original transformer was designed and evaluated on machine translation tasks."}],"bert-style-models":[{question:"What training objective does BERT use?",options:["Next-token prediction only","Masked language modeling — predicting randomly hidden tokens using bidirectional context","Image classification","Reinforcement learning from human feedback"],correctIndex:1,explanation:"BERT is trained by masking random tokens and predicting them using context from both directions."},{question:"What kind of tasks are BERT-style models especially strong at?",options:["Open-ended text generation","Understanding tasks like question answering and classification","Image generation","Audio synthesis"],correctIndex:1,explanation:"BERT's bidirectional context makes it excel at tasks requiring deep understanding of complete text."}],"gpt-style-models":[{question:"What is GPT's core training objective?",options:["Predicting the next token given all previous tokens","Predicting masked tokens using bidirectional context","Classifying images","Translating between two fixed languages only"],correctIndex:0,explanation:"GPT is trained autoregressively: predict the next token given everything before it."},{question:"Why can GPT-style models be pretrained on huge amounts of raw text?",options:["Because labels are required for every example","Because next-token prediction requires no labels beyond the text itself","Because they don't need any training","Because they only use encoder layers"],correctIndex:1,explanation:'Next-token prediction is self-supervised — the "label" is just the next word in the existing text, enabling massive-scale pretraining.'}]};function lc({topic:e,completed:t,onToggleComplete:n,onChange:i,onNext:r,onPrev:a}){let[o,s]=(0,h.useState)(!1),[l,c]=(0,h.useState)(e),u=ls[e.id],p=e.quiz??ll[e.id];return(0,d.jsxs)("div",{className:"space-y-6",children:[(0,d.jsxs)("div",{children:[(0,d.jsxs)("div",{className:"flex items-start justify-between gap-4 mb-3",children:[(0,d.jsxs)("button",{onClick:n,className:`flex items-center gap-1.5 text-sm font-medium ${t?"text-green-700 dark:text-green-400":"text-stone-400 hover:text-stone-600 dark:hover:text-stone-300"}`,children:[t?(0,d.jsx)(eZ,{className:"w-4 h-4"}):(0,d.jsx)(e0,{className:"w-4 h-4"}),t?"Completed":"Mark complete"]}),o?(0,d.jsxs)("div",{className:"flex gap-2 shrink-0",children:[(0,d.jsxs)(tw,{size:"sm",variant:"outline",onClick:()=>{c(e),s(!1)},children:[(0,d.jsx)(tE,{className:"w-4 h-4 mr-1"})," Cancel"]}),(0,d.jsxs)(tw
